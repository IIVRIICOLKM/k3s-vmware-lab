<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2010 1180" width="2010" height="1180" role="img" aria-label="entry.sh 실행 흐름">
<title>entry.sh 실행 흐름</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131a33"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3b5bff" stop-opacity=".15"/><stop offset="1" stop-color="#3b5bff" stop-opacity="0"/></radialGradient>
