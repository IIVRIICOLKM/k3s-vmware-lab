<style>
text { font-family: "Pretendard", "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; }
.ct { fill: #f2f5ff; font-size: 21px; font-weight: 700; }
.cl { fill: #a9b8e0; font-size: 15.5px; }
.mono { font-family: "JetBrains Mono", "D2Coding", "Noto Sans Mono CJK KR", ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }
.pt { fill: #f2f5ff; font-size: 19px; font-weight: 700; }
.pl { fill: #c4d0f2; font-size: 15.5px; }
.lb { font-size: 14px; font-weight: 700; }
.flow { stroke-dasharray: 12 9; animation: dash 1.2s linear infinite; }
.dash { stroke-dasharray: 8 8; }
@keyframes dash { to { stroke-dashoffset: -21; } }
@media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
</style>
</defs>
<rect width="2010" height="1180" rx="22" fill="url(#bg)"/>
<circle cx="1246" cy="590" r="708" fill="url(#glow)"/>
<text x="50" y="68" style="fill:#f2f5ff;font-size:38px;font-weight:800">entry.sh 전체 실행 흐름</text>
<text x="50" y="104" style="fill:#9fb0d8;font-size:17px">scripts/entry.sh 한 번으로 실습 환경을 구축·복구합니다. 모든 단계가 멱등이라 실패하면 원인만 고치고 같은 명령을 다시 실행합니다.</text>
<text x="50" y="130" class="pt" fill="#c9d4f5">실행 전 준비 (스크립트 앞부분)</text>
<g filter="url(#shadow)"><rect x="50" y="150" width="330" height="130" rx="16" fill="#151b30" stroke="#8a97bd" stroke-width="2"/></g>
<circle cx="80" cy="182" r="15" fill="#8a97bd"/><text x="80" y="188" text-anchor="middle" style="fill:#0b1020;font-size:16px;font-weight:800">a</text>
<text x="104" y="189" class="ct" style="font-size:21px">도움말 · 인자 검사</text>
<text x="72" y="212" class="cl" style="font-size:15.5px">-h 이면 영문 설명 출력</text>
<text x="72" y="235" class="cl" style="font-size:15.5px">인자는 받지 않음 (있으면 종료)</text>
<g filter="url(#shadow)"><rect x="445" y="150" width="330" height="130" rx="16" fill="#151b30" stroke="#8a97bd" stroke-width="2"/></g>
<circle cx="475" cy="182" r="15" fill="#8a97bd"/><text x="475" y="188" text-anchor="middle" style="fill:#0b1020;font-size:16px;font-weight:800">b</text>
<text x="499" y="189" class="ct" style="font-size:21px">골든 이미지 버전 결정</text>
<text x="467" y="212" class="cl" style="font-size:15.5px">infra/terraform/variables.tf의</text>
<text x="467" y="235" class="cl" style="font-size:15.5px">golden_vm_name 에서 버전 추출</text>
<g filter="url(#shadow)"><rect x="840" y="150" width="330" height="130" rx="16" fill="#151b30" stroke="#8a97bd" stroke-width="2"/></g>
<circle cx="870" cy="182" r="15" fill="#8a97bd"/><text x="870" y="188" text-anchor="middle" style="fill:#0b1020;font-size:16px;font-weight:800">c</text>
<text x="894" y="189" class="ct" style="font-size:21px">Ansible venv 확인</text>
<text x="862" y="212" class="cl" style="font-size:15.5px">~/.local/share/k3s-vmware-lab/</text>
<text x="862" y="235" class="cl" style="font-size:15.5px">ansible-venv 없으면 안내 후 종료</text>
<path d="M384 215 L439 215" stroke="#8a97bd" stroke-width="9.6" opacity=".32" filter="url(#blur)" fill="none" stroke-linejoin="round"/>
<path class="flow" d="M384 215 L439 215" stroke="#8a97bd" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-8a97bd)"/>
<path d="M779 215 L834 215" stroke="#8a97bd" stroke-width="9.6" opacity=".32" filter="url(#blur)" fill="none" stroke-linejoin="round"/>
<path class="flow" d="M779 215 L834 215" stroke="#8a97bd" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-8a97bd)"/>
<g filter="url(#shadow)"><rect x="1235" y="146" width="725" height="138" rx="16" fill="#0e2828" fill-opacity=".85" stroke="#2fd4c8" stroke-width="1.8"/></g>
<text x="1259" y="184" class="pt">공통 규칙</text>
<text x="1259" y="220" class="pl" style="font-size:15px">run() 은 단계 번호·로그·걸린 시간을 기록, skip() 은 0초로 기록</text>
<text x="1259" y="246" class="pl" style="font-size:15px">set -Eeuo pipefail + ERR trap: 실패하면 그 자리에서 멈추고 안내</text>
<text x="1259" y="272" class="pl" style="font-size:15px">lib/common.sh 의 경로·log·die·PIN_* 값을 모든 단계가 공유</text>
<g filter="url(#shadow)"><rect x="50" y="400" width="330" height="150" rx="16" fill="#0f2238" stroke="#35c4ff" stroke-width="2"/></g>
<circle cx="80" cy="432" r="15" fill="#35c4ff"/><text x="80" y="438" text-anchor="middle" style="fill:#0b1020;font-size:16px;font-weight:800">1</text>
<text x="104" y="439" class="ct" style="font-size:21px">vmrest 시작</text>
<text x="72" y="464" class="mono" fill="#35c4ff" style="font-size:14.5px">vmrest-start.sh</text>
<text x="72" y="487" class="cl" style="font-size:15.5px">VMware REST API를 127.0.0.1에서만</text>
<text x="72" y="510" class="cl" style="font-size:15.5px">열었는지 확인 (이미 떠 있으면 통과)</text>
<g filter="url(#shadow)"><rect x="445" y="400" width="330" height="150" rx="16" fill="#0f2238" stroke="#35c4ff" stroke-width="2"/></g>
<circle cx="475" cy="432" r="15" fill="#35c4ff"/><text x="475" y="438" text-anchor="middle" style="fill:#0b1020;font-size:16px;font-weight:800">2</text>
<text x="499" y="439" class="ct" style="font-size:21px">Rocky ISO 확인</text>
<text x="467" y="464" class="mono" fill="#35c4ff" style="font-size:14.5px">fetch-rocky-iso.sh</text>
<text x="467" y="487" class="cl" style="font-size:15.5px">서명 키 · CHECKSUM · SHA-256</text>
<text x="467" y="510" class="cl" style="font-size:15.5px">3단 검증 (있으면 검증만)</text>
<g filter="url(#shadow)"><rect x="840" y="400" width="330" height="150" rx="16" fill="#0f2238" stroke="#35c4ff" stroke-width="2"/></g>
<circle cx="870" cy="432" r="15" fill="#35c4ff"/><text x="870" y="438" text-anchor="middle" style="fill:#0b1020;font-size:16px;font-weight:800">3</text>
<text x="894" y="439" class="ct" style="font-size:21px">사전 점검</text>
<text x="862" y="464" class="mono" fill="#35c4ff" style="font-size:14.5px">preflight.sh</text>
<text x="862" y="487" class="cl" style="font-size:15.5px">14개 항목 읽기 전용 검사</text>
<text x="862" y="510" class="cl" style="font-size:15.5px">FAIL이 하나라도 있으면 중단</text>
<rect x="1080.875" y="516" width="77" height="24" rx="12" fill="#35c4ff" fill-opacity=".16" stroke="#35c4ff" stroke-opacity=".7"/>
<text x="1119.4375" y="533" text-anchor="middle" class="lb" fill="#35c4ff" style="font-size:12.5px">중단 지점</text>
<g filter="url(#shadow)"><rect x="1235" y="400" width="330" height="150" rx="16" fill="#1a1535" stroke="#a47bff" stroke-width="2"/></g>
<circle cx="1265" cy="432" r="15" fill="#a47bff"/><text x="1265" y="438" text-anchor="middle" style="fill:#0b1020;font-size:16px;font-weight:800">4</text>
<text x="1289" y="439" class="ct" style="font-size:21px">기준 이미지</text>
<text x="1257" y="464" class="mono" fill="#a47bff" style="font-size:14.5px">golden-build.sh</text>
<text x="1257" y="487" class="cl" style="font-size:15.5px">이미지 폴더가 이미 있으면 건너뜀</text>
<text x="1257" y="510" class="cl" style="font-size:15.5px">없으면 Packer 빌드 (약 11분)</text>
<rect x="1463.375" y="516" width="90" height="24" rx="12" fill="#a47bff" fill-opacity=".16" stroke="#a47bff" stroke-opacity=".7"/>
<text x="1508.1875" y="533" text-anchor="middle" class="lb" fill="#a47bff" style="font-size:12.5px">건너뜀 가능</text>
<g filter="url(#shadow)"><rect x="1630" y="400" width="330" height="150" rx="16" fill="#1a1535" stroke="#a47bff" stroke-width="2"/></g>
<circle cx="1660" cy="432" r="15" fill="#a47bff"/><text x="1660" y="438" text-anchor="middle" style="fill:#0b1020;font-size:16px;font-weight:800">5</text>
<text x="1684" y="439" class="ct" style="font-size:21px">Terraform 준비</text>
<text x="1652" y="464" class="mono" fill="#a47bff" style="font-size:14.5px">tf.sh init</text>
<text x="1652" y="487" class="cl" style="font-size:15.5px">provider 내려받기 · 잠금 해시</text>
<text x="1652" y="510" class="cl" style="font-size:15.5px">상태는 ~/.local/state 에 보관</text>
<path d="M384 475 L439 475" stroke="#35c4ff" stroke-width="9.6" opacity=".32" filter="url(#blur)" fill="none" stroke-linejoin="round"/>
<path class="flow" d="M384 475 L439 475" stroke="#35c4ff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-35c4ff)"/>
<path d="M779 475 L834 475" stroke="#35c4ff" stroke-width="9.6" opacity=".32" filter="url(#blur)" fill="none" stroke-linejoin="round"/>
<path class="flow" d="M779 475 L834 475" stroke="#35c4ff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-35c4ff)"/>
<path d="M1174 475 L1229 475" stroke="#35c4ff" stroke-width="9.6" opacity=".32" filter="url(#blur)" fill="none" stroke-linejoin="round"/>
