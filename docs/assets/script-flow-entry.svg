<path d="M1005 284 L1005 342 L215 342 L215 394" stroke="#8a97bd" stroke-width="9.6" opacity=".32" filter="url(#blur)" fill="none" stroke-linejoin="round"/>
<path class="flow" d="M1005 284 L1005 342 L215 342 L215 394" stroke="#8a97bd" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-8a97bd)"/>
<rect x="607" y="328" width="86" height="28" rx="14" fill="#0b1020" stroke="#8a97bd" stroke-opacity=".7"/>
<text x="650" y="347" text-anchor="middle" class="lb" fill="#8a97bd">준비 완료</text>
<g filter="url(#shadow)"><rect x="50" y="690" width="330" height="150" rx="16" fill="#1a1535" stroke="#a47bff" stroke-width="2"/></g>
<circle cx="80" cy="722" r="15" fill="#a47bff"/><text x="80" y="728" text-anchor="middle" style="fill:#0b1020;font-size:16px;font-weight:800">6</text>
<text x="104" y="729" class="ct" style="font-size:21px">VM 상태 + UI 목록</text>
<text x="72" y="754" class="mono" fill="#a47bff" style="font-size:14.5px">cluster-apply.sh</text>
<text x="72" y="777" class="cl" style="font-size:15.5px">VM 3대를 꺼진 채 생성 → 전원 켜기</text>
<text x="72" y="800" class="cl" style="font-size:15.5px">→ Workstation UI 목록에 등록</text>
<g filter="url(#shadow)"><rect x="445" y="690" width="330" height="150" rx="16" fill="#1a1535" stroke="#a47bff" stroke-width="2"/></g>
<circle cx="475" cy="722" r="15" fill="#a47bff"/><text x="475" y="728" text-anchor="middle" style="fill:#0b1020;font-size:16px;font-weight:800">7</text>
<text x="499" y="729" class="ct" style="font-size:21px">IP 목록 생성</text>
<text x="467" y="754" class="mono" fill="#a47bff" style="font-size:14.5px">render-inventory.sh</text>
<text x="467" y="777" class="cl" style="font-size:15.5px">vmrest 에서 VM IP를 조회해</text>
<text x="467" y="800" class="cl" style="font-size:15.5px">Ansible 인벤토리 파일 생성</text>
<g filter="url(#shadow)"><rect x="840" y="690" width="330" height="150" rx="16" fill="#10261f" stroke="#4be3a0" stroke-width="2"/></g>
<circle cx="870" cy="722" r="15" fill="#4be3a0"/><text x="870" y="728" text-anchor="middle" style="fill:#0b1020;font-size:16px;font-weight:800">8</text>
<text x="894" y="729" class="ct" style="font-size:21px">SSH 확인</text>
<text x="862" y="754" class="mono" fill="#4be3a0" style="font-size:14.5px">ansible ping.yml</text>
<text x="862" y="777" class="cl" style="font-size:15.5px">모든 노드에 SSH로 접속되는지</text>
<text x="862" y="800" class="cl" style="font-size:15.5px">확인 (설정 변경 없음)</text>
<g filter="url(#shadow)"><rect x="1235" y="690" width="330" height="150" rx="16" fill="#10261f" stroke="#4be3a0" stroke-width="2"/></g>
<circle cx="1265" cy="722" r="15" fill="#4be3a0"/><text x="1265" y="728" text-anchor="middle" style="fill:#0b1020;font-size:16px;font-weight:800">9</text>
<text x="1289" y="729" class="ct" style="font-size:21px">OS + K3s</text>
<text x="1257" y="754" class="mono" fill="#4be3a0" style="font-size:14.5px">ansible site.yml</text>
<text x="1257" y="777" class="cl" style="font-size:15.5px">OS 공통 설정 → K3s 서버 설치</text>
<text x="1257" y="800" class="cl" style="font-size:15.5px">→ 워커 합류 (멱등)</text>
<g filter="url(#shadow)"><rect x="1630" y="690" width="330" height="150" rx="16" fill="#151b30" stroke="#8a97bd" stroke-width="2"/></g>
<circle cx="1660" cy="722" r="15" fill="#8a97bd"/><text x="1660" y="728" text-anchor="middle" style="fill:#0b1020;font-size:16px;font-weight:800">✓</text>
<text x="1684" y="729" class="ct" style="font-size:21px">마무리</text>
<text x="1652" y="754" class="mono" fill="#8a97bd" style="font-size:14.5px">tf.sh output</text>
<text x="1652" y="777" class="cl" style="font-size:15.5px">노드 목록 조회 → 단계별 시간 표</text>
<text x="1652" y="800" class="cl" style="font-size:15.5px">→ provisioning complete 로그</text>
<rect x="1903.0" y="806" width="45" height="24" rx="12" fill="#8a97bd" fill-opacity=".16" stroke="#8a97bd" stroke-opacity=".7"/>
<text x="1925.5" y="823" text-anchor="middle" class="lb" fill="#8a97bd" style="font-size:12.5px">완료</text>
<path d="M384 765 L439 765" stroke="#a47bff" stroke-width="9.6" opacity=".32" filter="url(#blur)" fill="none" stroke-linejoin="round"/>
<path class="flow" d="M384 765 L439 765" stroke="#a47bff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-a47bff)"/>
<path d="M779 765 L834 765" stroke="#a47bff" stroke-width="9.6" opacity=".32" filter="url(#blur)" fill="none" stroke-linejoin="round"/>
<path class="flow" d="M779 765 L834 765" stroke="#a47bff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-a47bff)"/>
<path d="M1174 765 L1229 765" stroke="#4be3a0" stroke-width="9.6" opacity=".32" filter="url(#blur)" fill="none" stroke-linejoin="round"/>
<path class="flow" d="M1174 765 L1229 765" stroke="#4be3a0" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-4be3a0)"/>
<path d="M1569 765 L1624 765" stroke="#4be3a0" stroke-width="9.6" opacity=".32" filter="url(#blur)" fill="none" stroke-linejoin="round"/>
<path class="flow" d="M1569 765 L1624 765" stroke="#4be3a0" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-4be3a0)"/>
<path d="M1795 554 L1795 612 L215 612 L215 684" stroke="#a47bff" stroke-width="9.6" opacity=".32" filter="url(#blur)" fill="none" stroke-linejoin="round"/>
<path class="flow" d="M1795 554 L1795 612 L215 612 L215 684" stroke="#a47bff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-a47bff)"/>
<rect x="969" y="598" width="72" height="28" rx="14" fill="#0b1020" stroke="#a47bff" stroke-opacity=".7"/>
<text x="1005" y="617" text-anchor="middle" class="lb" fill="#a47bff">다음 줄</text>
<g filter="url(#shadow)"><rect x="50" y="910" width="725" height="200" rx="16" fill="#2e1820" fill-opacity=".85" stroke="#ff6b5e" stroke-width="1.8"/></g>
<text x="74" y="948" class="pt">어느 단계에서든 실패하면 (ERR trap)</text>
<text x="74" y="984" class="pl" style="font-size:15.5px">FAILED at step N/9: &lt;실패한 명령&gt; 출력 후 즉시 중단</text>
<text x="74" y="1013" class="pl" style="font-size:15.5px">원인을 고치고 scripts/entry.sh 를 다시 실행</text>
<text x="74" y="1042" class="pl" style="font-size:15.5px">완료된 단계는 건너뛰거나 변경 없이 통과 (멱등)</text>
<text x="74" y="1071" class="pl" style="font-size:15.5px">예) 이미지 폴더가 있으면 4단계 skip, Terraform은 No changes</text>
<g filter="url(#shadow)"><rect x="880" y="910" width="850" height="200" rx="16" fill="#151b30" fill-opacity=".85" stroke="#8a97bd" stroke-width="1.8"/></g>
<text x="904" y="948" class="pt">단계 묶음 (색)</text>
<text x="904" y="984" class="pl" style="font-size:15.5px">파랑  1~3  호스트 준비 : vmrest · ISO · 사전 점검</text>
<text x="904" y="1013" class="pl" style="font-size:15.5px">보라  4~7  이미지 · VM : 골든 이미지 · Terraform · 인벤토리</text>
<text x="904" y="1042" class="pl" style="font-size:15.5px">초록  8~9  노드 구성 : Ansible 로 SSH 확인 → OS + K3s</text>
<text x="904" y="1071" class="pl" style="font-size:15.5px">각 단계 내부 흐름은 script-flow-stages.svg 참고</text>
</svg>
