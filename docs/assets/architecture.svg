<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="k3s-vmware-lab 구성도">
  <title>k3s-vmware-lab 구성도</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131a33"/>
    </linearGradient>
    <linearGradient id="hostFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2342" stop-opacity=".75"/>
      <stop offset="1" stop-color="#121932" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3b5bff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#3b5bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <marker id="aBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 L4 6 Z" fill="#35c4ff"/></marker>
    <marker id="aPurple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 L4 6 Z" fill="#a47bff"/></marker>
    <marker id="aRed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 L4 6 Z" fill="#ff6b5e"/></marker>
    <marker id="aGold" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 L4 6 Z" fill="#ffd23f"/></marker>
    <marker id="aGoldS" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M11 1 L1 6 L11 11 L8 6 Z" fill="#ffd23f"/></marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; }
      .flow { stroke-dasharray: 10 8; animation: dash 1.1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -18; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
      .t  { fill: #f2f5ff; font-size: 21px; font-weight: 700; }
      .s  { fill: #9fb0d8; font-size: 15px; }
      .h  { fill: #c9d4f5; font-size: 13px; font-weight: 600; letter-spacing: .3px; }
      .lb { font-size: 12.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1000" height="560" rx="18" fill="url(#bg)"/>
  <circle cx="660" cy="280" r="330" fill="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity=".035">
    <path d="M0 80H1000M0 160H1000M0 240H1000M0 320H1000M0 400H1000M0 480H1000"/>
    <path d="M100 0V560M200 0V560M300 0V560M400 0V560M500 0V560M600 0V560M700 0V560M800 0V560M900 0V560"/>
  </g>

  <!-- 도구 열 -->
  <text x="40" y="52" class="h">IaC TOOLCHAIN</text>

  <g filter="url(#shadow)">
    <rect x="40" y="70" width="190" height="86" rx="14" fill="#10223a" stroke="#35c4ff" stroke-width="1.6"/>
    <rect x="40" y="226" width="190" height="86" rx="14" fill="#1c1636" stroke="#a47bff" stroke-width="1.6"/>
    <rect x="40" y="382" width="190" height="86" rx="14" fill="#331a22" stroke="#ff6b5e" stroke-width="1.6"/>
  </g>
  <text x="64" y="110" class="t">Packer</text>
  <text x="64" y="136" class="s">기준 이미지 빌드</text>
  <text x="64" y="266" class="t">Terraform</text>
  <text x="64" y="292" class="s">가상머신 선언·생성</text>
  <text x="64" y="422" class="t">Ansible</text>
  <text x="64" y="448" class="s">노드 구성·K3s 설치</text>

  <!-- 호스트 -->
  <g filter="url(#shadow)">
    <rect x="330" y="40" width="630" height="490" rx="20" fill="url(#hostFill)" stroke="#5a6aa8" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="3 5"/>
  </g>
  <text x="354" y="72" class="h">HOST · Ubuntu 26.04 · RTX 3090</text>

  <!-- VMware -->
  <rect x="354" y="92" width="582" height="214" rx="16" fill="#0f1730" stroke="#4a5fc4" stroke-width="1.4"/>
  <text x="376" y="122" class="h">VMware Workstation · vmnet8 (172.16.133.0/24)</text>

  <g filter="url(#shadow)">
    <rect x="376" y="146" width="166" height="132" rx="12" fill="#18234a" stroke="#6c86ff" stroke-width="1.4"/>
    <rect x="557" y="146" width="166" height="132" rx="12" fill="#18234a" stroke="#6c86ff" stroke-width="1.4"/>
    <rect x="738" y="146" width="176" height="132" rx="12" fill="#18234a" stroke="#6c86ff" stroke-width="1.4"/>
  </g>
  <text x="459" y="194" class="t" text-anchor="middle">k3s-server</text>
  <text x="459" y="222" class="s" text-anchor="middle">컨트롤 플레인</text>
  <text x="459" y="248" class="s" text-anchor="middle">Rocky 9.8</text>
  <text x="640" y="194" class="t" text-anchor="middle">worker-cpu-1</text>
  <text x="640" y="222" class="s" text-anchor="middle">워커 · 레지스트리</text>
  <text x="640" y="248" class="s" text-anchor="middle">Rocky 9.8</text>
  <text x="826" y="194" class="t" text-anchor="middle">worker-cpu-2</text>
  <text x="826" y="222" class="s" text-anchor="middle">워커</text>
  <text x="826" y="248" class="s" text-anchor="middle">Rocky 9.8</text>

  <!-- gpu-host -->
  <g filter="url(#shadow)">
    <rect x="354" y="392" width="582" height="110" rx="16" fill="#12261f" stroke="#4be3a0" stroke-width="1.6"/>
  </g>
  <text x="382" y="434" class="t">gpu-host</text>
  <text x="382" y="463" class="s">물리 GPU 노드 · NVIDIA device plugin</text>
  <text x="382" y="487" class="s">RTX 3090 24GB · 학습 / 추론 워크로드</text>
  <rect x="780" y="418" width="132" height="34" rx="17" fill="#4be3a0" fill-opacity=".14" stroke="#4be3a0" stroke-opacity=".7"/>
  <text x="846" y="440" class="s" text-anchor="middle" style="fill:#7ff0bd;font-weight:700">nvidia.com/gpu</text>

  <!-- 화살표: glow(아래) + 본선(위) -->
  <!-- Packer -> Terraform -->
  <path d="M135 156 V226" stroke="#35c4ff" stroke-width="9" opacity=".5" filter="url(#blur)" fill="none"/>
  <path class="flow" d="M135 158 V222" stroke="#35c4ff" stroke-width="3.5" fill="none" stroke-linecap="round" marker-end="url(#aBlue)"/>
  <text x="150" y="196" class="lb" fill="#35c4ff">골든 이미지</text>

  <!-- Terraform -> VMware -->
  <path d="M230 269 H354" stroke="#a47bff" stroke-width="9" opacity=".5" filter="url(#blur)" fill="none"/>
  <path class="flow" d="M232 269 H348" stroke="#a47bff" stroke-width="3.5" fill="none" stroke-linecap="round" marker-end="url(#aPurple)"/>
  <text x="240" y="256" class="lb" fill="#a47bff">VM 생성</text>

  <!-- Ansible -> VMware (위로 휘어 들어감) -->
  <path d="M230 410 C 300 410, 292 292, 360 292" stroke="#ff6b5e" stroke-width="9" opacity=".5" filter="url(#blur)" fill="none"/>
  <path class="flow" d="M232 410 C 300 410, 292 292, 354 292" stroke="#ff6b5e" stroke-width="3.5" fill="none" stroke-linecap="round" marker-end="url(#aRed)"/>
  <text x="278" y="350" class="lb" text-anchor="end" fill="#ff6b5e">SSH 구성</text>

  <!-- Ansible -> gpu-host -->
  <path d="M230 440 H354" stroke="#ff6b5e" stroke-width="9" opacity=".5" filter="url(#blur)" fill="none"/>
  <path class="flow" d="M232 440 H348" stroke="#ff6b5e" stroke-width="3.5" fill="none" stroke-linecap="round" marker-end="url(#aRed)"/>
  <text x="246" y="430" class="lb" fill="#ff6b5e">합류</text>

  <!-- VMware <-> gpu-host (K3s 클러스터) -->
  <path d="M645 306 V392" stroke="#ffd23f" stroke-width="10" opacity=".5" filter="url(#blur)" fill="none"/>
  <path class="flow" d="M645 312 V386" stroke="#ffd23f" stroke-width="3.8" fill="none" stroke-linecap="round" marker-start="url(#aGoldS)" marker-end="url(#aGold)"/>
  <rect x="664" y="336" width="196" height="26" rx="13" fill="#ffd23f" fill-opacity=".14" stroke="#ffd23f" stroke-opacity=".7"/>
  <text x="762" y="354" class="lb" text-anchor="middle" fill="#ffd23f">K3s 클러스터 · flannel</text>
</svg>
