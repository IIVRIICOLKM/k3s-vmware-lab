# Prometheus scrape configuration (loaded through the ConfigMap prometheus-config, see ../kustomization.yaml).
# Every target is found by the Kubernetes API from labels the pods already have, so the workload chart
# (charts/k3slab-workload) needs no change. Six jobs; `up{job=...}` shows each one.
#
# [한국어 설명] 수집 대상 여섯 가지. 모두 파드 라벨로 찾는다(차트는 고치지 않는다).
#   k3slab-infer       추론 워커 /metrics (라벨 k3slab.io/kind=infer, 5초 간격)
#   dcgm-exporter      GPU 지표(gpu-host의 dcgm-exporter, 5초 간격)
#   node-exporter      노드 CPU·메모리·디스크(노드마다 1개)
#   kube-state-metrics 파드·Job·Deployment·노드 상태
#   cadvisor           컨테이너별 CPU·메모리(kubelet cAdvisor를 API 서버 프록시로 읽음)
#   prometheus         Prometheus 자신
#   작업 상태(MySQL jobs 테이블)는 Prometheus가 아니라 Grafana의 MySQL 데이터소스가 직접 읽는다.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: k3s-vmware-lab

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Inference worker (apps/infer, GET /metrics on the container port). Any namespace, picked by the chart's pod label.
  # Only Running pods: a GPU pod waiting in Pending would show up as a permanently down target.
  - job_name: k3slab-infer
    scrape_interval: 5s
    scrape_timeout: 4s
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_k3slab_io_kind]
        regex: infer
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      # One target per declared container port (the worker declares exactly one).
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: .+
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      # Helm release name (e.g. infer, infer-bench): lets a dashboard pick one deployment.
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
        target_label: release

  # GPU metrics from dcgm-exporter on gpu-host (infra/k8s/monitoring/dcgm-exporter.yaml).
  - job_name: dcgm-exporter
    scrape_interval: 5s
    scrape_timeout: 4s
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [monitoring]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: dcgm-exporter
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  # Node CPU, memory, disk (infra/k8s/monitoring/node-exporter.yaml, one pod per node).
  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [monitoring]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: node-exporter
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  # Object state: pods, Jobs, Deployments, nodes. Its metrics carry their own `pod`/`namespace` labels, so the
  # target must not overwrite them (honor_labels).
  - job_name: kube-state-metrics
    honor_labels: true
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [monitoring]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: kube-state-metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http-metrics
        action: keep

  # Per-container CPU and memory from every node's kubelet (cAdvisor), read through the API server proxy:
  # /api/v1/nodes/<node>/proxy/metrics/cadvisor. Only the series the dashboards use are kept.
  - job_name: cadvisor
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|cpu_cfs_throttled_periods_total|cpu_cfs_periods_total|network_receive_bytes_total|network_transmit_bytes_total)
        action: keep
      # CPU and memory are kept per container only; the pod-level cgroup series (container="" or "POD") would double
      # every sum. Network series exist only at pod level and stay.
      - source_labels: [__name__, container]
        regex: container_(cpu|memory)[^;]*;(|POD)
        action: drop
