# Monitoring stack (proposal weeks 12-14): Prometheus + Grafana + exporters in the `monitoring` namespace, as plain
# manifests (no Helm, no operator, no CRDs). Applied by scripts/monitoring-deploy.sh with `kubectl apply -k`.
# Secrets (Grafana admin password, MySQL read-only password) are NOT here: the script creates the Secret
# `grafana-secrets` in the cluster and keeps a copy in ~/.config/k3s-vmware-lab/secrets/monitoring.env.
#
# [한국어 설명] 모니터링 전체 목록. `kubectl apply -k infra/k8s/monitoring`로 한 번에 올린다.
#   - 설정 파일(prometheus.yml, Grafana provisioning)은 configMapGenerator가 ConfigMap으로 만든다.
#     이름에 내용 해시가 붙어서, 설정을 고치면 Deployment가 자동으로 새로 뜬다.
#   - 대시보드 JSON(grafana-dashboards)은 해시를 붙이지 않는다. 같은 이름의 ConfigMap 내용만 바뀌면
#     Grafana가 약 1분 안에 파일을 다시 읽는다(파드 재시작 없음).
#   - 한 ConfigMap의 크기 한도는 1 MiB, `kubectl apply`의 주석 한도는 약 256 KB다. 대시보드 JSON이 합쳐서 200 KB를
#     넘으면 ConfigMap을 나눠야 한다(scripts/monitoring-deploy.sh가 크기를 검사한다).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - prometheus.yaml
  - grafana.yaml
  - kube-state-metrics.yaml
  - node-exporter.yaml
  - dcgm-exporter.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus/prometheus.yml
  - name: grafana-provisioning
    files:
      - datasources.yaml=grafana/datasources.yaml
      - dashboards.yaml=grafana/dashboards.yaml
  - name: grafana-dashboards
    options:
      disableNameSuffixHash: true
    files:
      - dashboards/k3slab-inference.json
      - dashboards/k3slab-training.json
      - dashboards/k3slab-nodes.json
