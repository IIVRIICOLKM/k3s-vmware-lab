#version=RHEL9
text
cdrom
eula --agreed
firstboot --disable

lang en_US.UTF-8
keyboard us
timezone ${timezone} --utc

network --bootproto=static --device=link --activate --onboot=on --ip=${build_ip} --netmask=255.255.255.0 --gateway=${build_gateway} --nameserver=${build_gateway} --hostname=${hostname}

rootpw --lock
user --name=${admin_user} --password=${admin_password_hash} --iscrypted --groups=wheel
sshkey --username=${admin_user} "${ssh_public_key}"

firewall --enabled --service=ssh
selinux --enforcing
services --enabled=NetworkManager,sshd,chronyd,vmtoolsd
skipx

zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --type=lvm --nohome --noswap
bootloader --location=mbr

reboot

%packages
@^server-product-environment
ca-certificates
chrony
curl
jq
open-vm-tools
openssh-server
python3
sudo
-gnome-shell
-xorg-x11-server-Xorg
%end

%post --erroronfail --log=/root/k3slab-kickstart-post.log
cat >/etc/sudoers.d/90-${admin_user} <<'EOF'
${admin_user} ALL=(ALL) NOPASSWD:ALL
EOF
chmod 0440 /etc/sudoers.d/90-${admin_user}

install -d -m 0755 /etc/ssh/sshd_config.d
cat >/etc/ssh/sshd_config.d/90-k3slab.conf <<'EOF'
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
EOF

systemctl set-default multi-user.target
dnf -y upgrade --refresh
dnf -y clean all
%end
