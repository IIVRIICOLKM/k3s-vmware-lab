[defaults]
# Static hosts (the physical GPU host) plus the VM inventory rendered from Terraform by scripts/render-inventory.sh.
inventory = inventories/lab/hosts.yml,inventories/lab/.generated/terraform.yml
roles_path = roles
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = false
forks = 5

[ssh_connection]
pipelining = true
