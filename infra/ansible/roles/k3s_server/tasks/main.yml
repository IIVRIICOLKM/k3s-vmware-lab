- name: Create the cluster join token on the control node (first run only)
  ansible.builtin.set_fact:
    k3s_token: "{{ lookup('ansible.builtin.password', k3s_token_file ~ ' length=48 chars=ascii_letters,digits') }}"
  no_log: true

- name: Keep the token file private
  ansible.builtin.file:
    path: "{{ k3s_token_file }}"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Install and start the k3s server
  ansible.builtin.include_role:
    name: k3s_node
  vars:
    k3s_mode: server
    k3s_config:
      node-name: "{{ inventory_hostname }}"
      token: "{{ k3s_token }}"
      selinux: "{{ (ansible_facts.selinux.status | default('disabled')) == 'enabled' }}"
      tls-san:
        - "{{ k3s_server_hostname }}"
        - "{{ ansible_host }}"
      write-kubeconfig-mode: "0600"
      node-label: "{{ k3s_node_labels | default([]) }}"

- name: Wait until the API server reports ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl get --raw=/readyz
  register: k3s_readyz
  until: k3s_readyz.stdout == "ok"
  retries: 60
  delay: 5
  changed_when: false

- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_raw
  no_log: true

- name: Store the kubeconfig on the control node, pointed at the server address
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig_raw.content | b64decode | replace('https://127.0.0.1:6443', 'https://' ~ ansible_host ~ ':6443') }}"
    dest: "{{ k3s_kubeconfig_file }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true

# The VM nodes hand `search localdomain` to every pod (NetworkManager/vmnet8 DHCP); the vmnet8 NAT DNS never answers
# the *.cluster.local.localdomain lookups that ndots:5 produces, so cluster names took about 6 s. This ConfigMap makes
# CoreDNS answer the localdomain zone with NXDOMAIN itself. K3s applies every manifest in this directory and re-applies
# it when the file changes (same mechanism as the NVIDIA device plugin in playbooks/gpu-host.yml); CoreDNS reloads it.
# Details: infra/k8s/coredns-custom.yaml and docs/labs/dns-localdomain-*.md.
- name: Deploy the CoreDNS customisation (localdomain zone answers NXDOMAIN)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../k8s/coredns-custom.yaml"
    dest: /var/lib/rancher/k3s/server/manifests/k3slab-coredns-custom.yaml
    mode: "0600"
