# VMs (k3s-server, worker-cpu-1, worker-cpu-2) are added by .generated/terraform.yml; only the physical host lives here.
all:
  children:
    k3s_cluster:
      children:
        k3s_server: {}
        k3s_agents: {}
    k3s_agents:
      children:
        gpu_nodes: {}
    gpu_nodes:
      hosts:
        gpu-host:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
