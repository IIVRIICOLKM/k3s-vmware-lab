# VMs (k3s-server, worker-cpu-1, worker-cpu-2) are added by .generated/terraform.yml; only the physical host lives here.
all:
  children:
    k3s_cluster:
      children:
        k3s_server: {}
        k3s_agents: {}
    k3s_agents:
      children:
        gpu_nodes: {}
    gpu_nodes:
      hosts:
        gpu-host:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
          # Ubuntu 26.04 points /usr/bin/sudo at sudo-rs, which wraps the -p prompt ("[sudo: <prompt>] 비밀번호:"), so
          # Ansible never sees its become prompt and times out. Use the classic sudo that ships alongside it.
          ansible_become_exe: /usr/bin/sudo.ws
