# Inference worker template (apps/infer, C++). Usage:
#   helm upgrade --install infer charts/k3slab-workload -f charts/k3slab-workload/values-infer.yaml \
#     --set infer.modelJobId=<training job id> [--set infer.maxBatch=1]
#   CPU only (e.g. while a training Job holds the only GPU): --set gpu=0 --set infer.device=cpu
kind: infer
image:
  repository: registry.k3slab.local:5000/infer-worker
  tag: v0.2
model:
  version: v0
# Batches run on the RTX 3090 (CUDA, apps/infer/backend_cuda.cu). gpu-host has one GPU, so a GPU inference pod and a
# training Job cannot hold it at the same time; the one that comes second waits in Pending.
gpu: 1
resources:
  requests:
    cpu: 250m
    memory: 64Mi
infer:
  modelJobId: ""
  replicas: 1
  queueSize: 100
  maxBatch: 8
  timeoutMs: 2000
  threads: 2
  workMs: 0
  device: auto
