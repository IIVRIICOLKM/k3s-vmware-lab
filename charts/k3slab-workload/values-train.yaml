# Training run template. Usage:
#   helm upgrade --install train-<id> charts/k3slab-workload -f charts/k3slab-workload/values-train.yaml \
#     --set train.jobId=<id> [--set model.version=v0 --set train.epochs=20 --set-string train.hidden=2048\,2048]
#   Prefer scripts/job.sh submit train <id>: it records PENDING in MySQL first and refuses a duplicate job id.
kind: train
image:
  repository: registry.k3slab.local:5000/train-worker
  tag: v0.4
model:
  version: v0
train:
  epochs: 10
  stepsPerEpoch: 200
