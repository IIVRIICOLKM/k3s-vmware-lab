{{- if eq .Values.kind "train" }}
{{- $id := required "train.jobId is required (one job id per training run)" .Values.train.jobId }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,40}[a-z0-9])?$" $id) }}
{{- fail "train.jobId must be lowercase letters, digits and '-' (max 42 chars)" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: train-{{ $id }}
  labels:
    {{- include "k3slab.labels" . | nindent 4 }}
    k3slab.io/job-id: {{ $id }}
spec:
  backoffLimit: {{ .Values.train.backoffLimit }}
  # Exit code 2 = a wrong request (bad dataset or --hidden, job id used by another model version). It fails the
  # same way every time, so fail the Job at once instead of retrying it backoffLimit times.
  podFailurePolicy:
    rules:
      - action: FailJob
        onExitCodes:
          containerName: train
          operator: In
          values: [2]
  template:
    metadata:
      labels:
        {{- include "k3slab.labels" . | nindent 8 }}
        k3slab.io/job-id: {{ $id }}
    spec:
      restartPolicy: Never
      # Time to finish the current step and write the SIGTERM checkpoint.
      terminationGracePeriodSeconds: 60
      {{- include "k3slab.gpuPlacement" . | trim | nindent 6 }}
      containers:
        - name: train
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --job-id={{ $id }}
            - --model-version={{ .Values.model.version }}
            - --epochs={{ .Values.train.epochs }}
            - --steps-per-epoch={{ .Values.train.stepsPerEpoch }}
            - --batch-size={{ .Values.train.batchSize }}
            - --epoch-sleep={{ .Values.train.epochSleep }}
            - --dataset={{ .Values.train.dataset }}
            - --hidden={{ .Values.train.hidden }}
            - --checkpoint-dir=/checkpoints
          env:
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          {{- with .Values.db.secretName }}
          # DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD for apps/train/jobdb.py
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- include "k3slab.resources" . | trim | nindent 10 }}
          volumeMounts:
            - name: checkpoints
              mountPath: /checkpoints
            - name: datasets
              mountPath: /data
              readOnly: true
      volumes:
        - name: checkpoints
          hostPath:
            path: {{ .Values.checkpoints.hostPath }}
            type: DirectoryOrCreate
        - name: datasets
          hostPath:
            path: {{ .Values.datasets.hostPath }}
            type: DirectoryOrCreate
{{- end }}
